<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Outer accent rim -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="4" />

  <!-- Inner glowing gauge arc -->
  <path d="M 120 320 A 150 150 0 1 1 392 320" fill="none" stroke="#334155" stroke-width="24" stroke-linecap="round" />
  <path d="M 120 320 A 150 150 0 1 1 340 180" fill="none" stroke="url(#primary)" stroke-width="24" stroke-linecap="round" filter="url(#glow)" />

  <!-- Center Car silhouette -->
  <g transform="translate(156, 210) scale(0.78)" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Car roof & windshield -->
    <path d="M 30 70 L 65 20 L 195 20 L 230 70 Z" fill="#f59e0b" fill-opacity="0.2" stroke="url(#primary)" />
    <!-- Car body -->
    <path d="M 10 70 L 250 70 C 260 70 265 75 265 85 L 265 110 C 265 115 260 120 250 120 L 225 120 C 225 105 210 95 195 95 C 180 95 165 105 165 120 L 95 120 C 95 105 80 95 65 95 C 50 95 35 105 35 120 L 10 120 C 0 120 -5 115 -5 110 L -5 85 C -5 75 0 70 10 70 Z" fill="#0f172a" />
    <!-- Wheels -->
    <circle cx="65" cy="120" r="26" fill="#1e293b" stroke="#f59e0b" stroke-width="14" />
    <circle cx="195" cy="120" r="26" fill="#1e293b" stroke="#f59e0b" stroke-width="14" />
    <!-- Headlight beam -->
    <circle cx="245" cy="85" r="8" fill="#fbbf24" stroke="none" />
  </g>

  <!-- Speedometer Needle -->
  <circle cx="256" cy="310" r="16" fill="#f59e0b" />
  <line x1="256" y1="310" x2="310" y2="230" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" />
</svg>
